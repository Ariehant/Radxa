[package]
name = "nexus"
version = "0.1.0"
description = "Nexus — Knowledge + Workflow OS"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
walkdir = "2"
parking_lot = "0.12"
log = "0.4"
