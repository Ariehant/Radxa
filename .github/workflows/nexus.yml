name: nexus

on:
  push:
    paths: ["nexus/**", ".github/workflows/nexus.yml"]
  pull_request:
    paths: ["nexus/**", ".github/workflows/nexus.yml"]

defaults:
  run:
    working-directory: nexus

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus/src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib perf_ -- --ignored --nocapture
      - name: e2e (real backend + UI in headless Chromium)
        if: runner.os == 'Linux'
        run: |
          npx playwright@1.56.1 install chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: npm run e2e
      - name: Build app bundles
        run: npx tauri build
      - name: Smoke-launch (Linux)
        if: runner.os == 'Linux'
        run: timeout 15 xvfb-run -a ./src-tauri/target/release/nexus || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.os }}
          path: |
            nexus/src-tauri/target/release/bundle/**/*.deb
            nexus/src-tauri/target/release/bundle/**/*.AppImage
            nexus/src-tauri/target/release/bundle/**/*.msi
            nexus/src-tauri/target/release/bundle/**/*-setup.exe
